name: Bug report
description: Report a reproducible problem using synthetic input only.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please use a small, fully synthetic reproduction. Do not upload raw production captures, credentials, cookies, private documents, or personal data.
        For a security vulnerability, follow SECURITY.md and email ggoalmeidaa@gmail.com privately.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version and operating system.
      placeholder: "Node.js 22.x, Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the command and the smallest synthetic input that demonstrates the problem. Use invented domains and fake values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Review any output excerpt before including it. Remove private file paths and identifying values.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Input and attachment review
      options:
        - label: This report uses synthetic input, and I reviewed all text and attachments for sensitive information.
          required: true
